<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="awBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="awWShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.38"/>
    </filter>
    <filter id="awAShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#991b1b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer circular border and light blue/cyan background -->
  <circle cx="32" cy="32" r="29.5" fill="url(#awBgGrad)" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#0EA5E9" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Red letter 'A' -->
  <path d="M32 10.5L48.5 51.5H39.8L35.7 40H28.3L24.2 51.5H15.5L32 10.5ZM32 23.5L29.6 33.2H34.4L32 23.5Z" 

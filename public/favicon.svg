        fill-rule="evenodd"
        filter="url(#awAShadow)"/>

  <!-- White letter 'W' overlaid on top of 'A' -->
  <path d="M19.5 31.5L25.8 49L32 35.5L38.2 49L44.5 31.5" 
        stroke="#FFFFFF" 
        stroke-width="4.8" 
